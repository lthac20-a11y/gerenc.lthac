<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTHAC</title>
    <meta name="description" content="Sistema de gestão de escalas de plantão, frequência, reposições e certificados da Liga do Trauma Hospital Angelina Caron (LTHAC)." />
    <meta property="og:title" content="LTHAC" />
    <meta property="og:description" content="Sistema de gestão de escalas de plantão, frequência, reposições e certificados da Liga do Trauma Hospital Angelina Caron (LTHAC)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="application-name" content="LTHAC">
    <meta name="apple-mobile-web-app-title" content="LTHAC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Canvas Dynamic PNG Icon & Manifest Generator -->
    <script>
    (function() {
      function generateLogoPNG(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fundo escuro arredondado (#0b0f19)
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, size, size);

        // Círculo central verde escuro suave
        const pad = size * 0.1;
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = size * 0.05;
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, (size / 2) - pad, 0, Math.PI * 2);
        ctx.stroke();

        // Linha de pulso ECG verde (#10b981)
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size * 0.065;
        ctx.moveTo(size * 0.20, size * 0.52);
        ctx.lineTo(size * 0.34, size * 0.52);
        ctx.lineTo(size * 0.42, size * 0.28);
        ctx.lineTo(size * 0.53, size * 0.74);
        ctx.lineTo(size * 0.62, size * 0.42);
        ctx.lineTo(size * 0.68, size * 0.52);
        ctx.lineTo(size * 0.80, size * 0.52);
        ctx.stroke();

        return canvas.toDataURL('image/png');
      }

      const icon192 = generateLogoPNG(192);
      const icon512 = generateLogoPNG(512);

      // Injetar links PNG reais no <head> para o atalho do Android e iOS
      const links = [
        { rel: 'icon', type: 'image/png', sizes: '192x192', href: icon192 },
        { rel: 'icon', type: 'image/png', sizes: '512x512', href: icon512 },
        { rel: 'shortcut icon', type: 'image/png', href: icon192 },
        { rel: 'apple-touch-icon', sizes: '192x192', href: icon192 }
      ];
      links.forEach(attrs => {
        const link = document.createElement('link');
        Object.entries(attrs).forEach(([k, v]) => link.setAttribute(k, v));
        document.head.appendChild(link);
      });

      // Gerar e vincular manifest com os PNGs em Base64
      const manifest = {
        name: 'Liga do Trauma - LTHAC',
        short_name: 'LTHAC',
        start_url: window.location.pathname,
        scope: window.location.pathname,
        display: 'standalone',
        background_color: '#0b0f19',
        theme_color: '#0b0f19',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);
    })();
    </script>

    <!-- Google Fonts for Academic Certificate and clean UI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Erro:', err));
        });
      }
    </script>
  </body>
